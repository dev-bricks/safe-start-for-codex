[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "safe-start-for-codex"
version = "1.1.4"
description = "Unofficial Windows startup gate for Codex Desktop automations and catch-up pacing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Lukas Geiger" }
]
keywords = ["codex", "openai", "codex-desktop", "automation", "automation-gate", "windows", "startup", "catch-up"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Software Development",
  "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
tray = [
  "pillow>=12.2.0",
  "pystray>=0.19.5"
]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.5.0"
]
build = [
  "pyinstaller>=6.0"
]

[project.scripts]
safe-start-for-codex = "safe_start_for_codex.cli:main"

[project.urls]
Homepage = "https://github.com/dev-bricks/safe-start-for-codex"
Documentation = "https://github.com/dev-bricks/safe-start-for-codex#readme"
Repository = "https://github.com/dev-bricks/safe-start-for-codex"
Issues = "https://github.com/dev-bricks/safe-start-for-codex/issues"
"Bug Tracker" = "https://github.com/dev-bricks/safe-start-for-codex/issues"
Changelog = "https://github.com/dev-bricks/safe-start-for-codex/blob/main/CHANGELOG.md"
Security = "https://github.com/dev-bricks/safe-start-for-codex/security/advisories"
"Parent Organization" = "https://github.com/dev-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"


[tool.hatch.build.targets.wheel]
packages = ["src/safe_start_for_codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "*_smoke.py"]
addopts = "-ra -v"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]


