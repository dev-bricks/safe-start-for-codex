    <text x="86" y="432" fill="#3fb950" font-weight="bold">STATUS: RUNNING</text>
    <text x="230" y="432" fill="#e6edf3">All 10 Governance Invariants active | System load stable | Clean restore on exit guaranteed</text>

    <!-- Prompt 2 -->
    <text x="44" y="475" fill="#7ee787">PS C:\_Local_DEV\repos\safe-start-for-codex&gt;</text>
