name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: python -m pip install -e ".[dev,tray]"
      - name: Install zombie-killer-tray (Python 3.12+ only; it doesn't support 3.11)
        if: matrix.python-version != '3.11'
        run: python -m pip install "zombie-killer-tray @ git+https://github.com/dev-bricks/zombie-killer-tray.git@039b4f2c7acd69063b39d6168c757b0b2fca2438"
      - name: Lint
        run: ruff check .
      - name: Bytecode compilation check
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -ra -v
