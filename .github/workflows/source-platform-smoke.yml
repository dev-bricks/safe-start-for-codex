name: Source Platform Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # tray is part of the smoke: the tray test mocks pystray but draws the
        # fallback icon for real, so Pillow has to be there on Linux and macOS
        # too -- same extras as the Windows job in ci.yml.
        run: python -m pip install -e ".[dev,tray]"
      - name: Smoke tests
        run: pytest tests/source_platform_smoke.py -v
